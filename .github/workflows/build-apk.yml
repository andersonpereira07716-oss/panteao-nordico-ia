name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies & Build Web
      run: |
        cd frontend
        npm install
        npm run build

    - name: Add Android Platform & Fix Kotlin Conflict
      run: |
        cd frontend
        npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android
        npx @capacitor/cli add android || true
        npx @capacitor/cli sync android
        
        # Injeta a regra de resolução de conflitos do Kotlin no build.gradle do projeto Android
        cd android
        echo "" >> build.gradle
        echo "allprojects {" >> build.gradle
        echo "    configurations.all {" >> build.gradle
        echo "        resolutionStrategy.eachDependency { details ->" >> build.gradle
        echo "            if (details.requested.group == 'org.jetbrains.kotlin') {" >> build.gradle
        echo "                details.useVersion '1.8.22'" >> build.gradle
        echo "            }" >> build.gradle
        echo "        }" >> build.gradle
        echo "    }" >> build.gradle
        echo "}" >> build.gradle

    - name: Build Android Debug APK
      run: |
        cd frontend/android
        chmod +x gradlew
        ./gradlew clean assembleDebug --warning-mode all

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
